name: Test

on:
  push:
    branches:
      - main
      - "hardening/**"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Rebuild generated files
        run: npm run build

      - name: Generated files match the committed ones
        run: git diff --exit-code

      - name: Test gate (static checks, both builds, gate self-tests)
        run: npm test

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stitch-test-report
          path: _scratch/test-report.json
          if-no-files-found: ignore
