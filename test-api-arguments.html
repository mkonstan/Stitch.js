<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Stitch.js API argument tests</title>
    <style>
        body { font-family: sans-serif; margin: 20px; }
        .stage { border: 1px dashed #bbb; margin: 6px 0; padding: 6px; }
    </style>
</head>
<body>
    <h1>API arguments</h1>
    <p>
        Every public entry point that takes a selector, element, handler, handle or event name
        throws when the argument is invalid or matches nothing, instead of doing nothing (D3).
    </p>
    <div id="stage"></div>

    <script src="stitch.js"></script>
    <script src="tests/harness.js"></script>
    <script>
        StitchTest.plan([
            'binder-arguments',
            'model-change-handler-arguments',
            'model-event-arguments',
            'model-path-arguments',
            'message-bus-arguments',
            'old-helper-names-fail-loudly',
            'off-removes-a-once-subscription',
            'events-and-change-handlers-do-not-overload',
            'old-name-assignment-throws',
            'events-live-on-the-root-model',
            'a-model-cannot-be-nested',
            'moving-within-a-model-re-points-the-parent',
            'to-raw-returns-plain-data',
            'reactive-on-a-nested-object-throws',
            'shared-raw-collections-throw',
            'set-members-and-map-values-cannot-move-across-models',
            'map-and-set-initial-content-is-reactive',
            'aliases-keep-the-first-parent'
        ]);

        function mount(html) {
            const host = document.createElement('div');
            host.className = 'stage';
            host.innerHTML = html;
            document.getElementById('stage').appendChild(host);
            return host;
        }
        const tick = (ms = 20) => new Promise(resolve => setTimeout(resolve, ms));
        const thrown = fn => { try { fn(); return ''; } catch (error) { return String(error && error.message); } };

        (async () => {
            await StitchTest.test('binder-arguments', async (t) => {
                const binder = new Stitch.DataBinder();
                t.match(thrown(() => binder.unbind('#no-such-element')), /unbind\("#no-such-element"\): no element matches/, 'unbind() of a selector that matches nothing throws');
                t.match(thrown(() => binder.unbind(42)), /must be a DOM element or a selector/, 'unbind() of a non-element throws');
                t.match(thrown(() => binder.unbind(mount('<span></span>'))), /nothing is bound/, 'unbind() of an element this binder never bound throws');
                const host = mount('<span data-text="a"></span>');
                binder.bind(host, Stitch.Observable.create({ a: 1 }));
                t.equal(thrown(() => binder.unbind(host)), '', 'control: unbind() of a bound root works');
                t.match(thrown(() => new Stitch.DataBinder({ onbind() {} })), /unknown hook "onbind".*onBind/, 'a misspelled hook name throws');
                t.match(thrown(() => new Stitch.DataBinder({ onChange: 42 })), /onChange must be a function/, 'a hook that is not a function throws');
                binder.dispose();
                t.match(thrown(() => binder.bind(mount('<i data-text="a"></i>'), Stitch.Observable.create({ a: 1 }))), /disposed/, 'bind() on a disposed binder throws');
            });

            await StitchTest.test('model-change-handler-arguments', async (t) => {
                const model = Stitch.Observable.create({ n: 1 });
                const seen = [];
                const handler = change => seen.push(change.field);
                t.match(thrown(() => model.$onChange(42)), /\$onChange\(handler\): handler must be a function/, 'model.$onChange() of a non-function throws');
                model.$onChange(handler);
                t.match(thrown(() => model.$offChange(undefined)), /\$offChange\(handler\).*undefined/, 'model.$offChange(undefined) throws');
                t.match(thrown(() => model.$offChange(() => {})), /not a change handler of this object/, 'model.$offChange() of a handler that was never added throws');
                t.match(thrown(() => model.$offChange()), /\$offChange\(handler\) needs the handler/, 'model.$offChange() with no argument throws (removing is explicit)');
                model.n = 2;
                t.deepEqual(seen, ['n'], 'the real handler is still installed after those mistakes');
                t.equal(thrown(() => model.$offChange(handler)), '', 'control: model.$offChange(handler) removes it');
                model.n = 3;
                t.deepEqual(seen, ['n'], 'control: and it no longer fires');
            });

            await StitchTest.test('model-event-arguments', async (t) => {
                const model = Stitch.Observable.create({ n: 1 });
                t.match(thrown(() => model.$on('', () => {})), /event name must be a non-empty string/, '$on with an empty event name throws');
                t.match(thrown(() => model.$on('saved', 'handler')), /callback must be a function/, '$on with a non-function callback throws');
                t.match(thrown(() => model.$once('saved')), /callback must be a function/, '$once without a callback throws');
                t.match(thrown(() => model.$off('saved', () => {})), /is not subscribed to "saved"/, '$off of a callback that was never subscribed throws');
                t.match(thrown(() => model.$emit(42)), /event name must be a non-empty string/, '$emit with a non-string event throws');
                t.match(thrown(() => model.$use('x')), /middleware must be a function/, '$use with a non-function throws');
                const cb = () => {};
                model.$on('saved', cb);
                t.equal(thrown(() => model.$off('saved', cb)), '', 'control: $off of a subscribed callback works');
            });

            await StitchTest.test('model-path-arguments', async (t) => {
                const model = Stitch.Observable.create({ name: 'Ann', user: { email: 'a@x' } });
                t.match(thrown(() => model.$get('nmae')), /"nmae" is not a property of the model/, 'model.$get() of a missing property throws');
                t.match(thrown(() => model.$set('user.nmae', 1)), /"nmae" is not a property of "user"/, 'model.$set() of a missing nested property throws (it would add a non-reactive property)');
                t.equal(model.$get('user.email'), 'a@x', 'control: model.$get() of a real path works');
                model.$set('user.email', 'b@x');
                t.equal(model.user.email, 'b@x', 'control: model.$set() of a real path writes');
                model.$set('added', 1);
                t.equal(Object.getOwnPropertyDescriptor(model, 'added').get !== undefined, true, 'control: model.$set() of a new top-level key adds a reactive property');
                t.match(thrown(() => model.$set(42, 1)), /\$set\(key, value\): key must be a non-empty string/, '$set with a non-string key throws');
                t.equal(thrown(() => Stitch.Observable.create({ on: true, off: 1, get: 'g', set: 's' })), '', 'fields named on, off, get, set are allowed (D28)');
                t.match(thrown(() => Stitch.Observable.create({ toJSON: 1 })), /"toJSON" is reserved/, 'a model property named toJSON throws');
            });

            await StitchTest.test('old-helper-names-fail-loudly', async (t) => {
                const model = Stitch.Observable.create({ n: 1, list: [1], tags: new Set(['a']) });
                const renamed = { on: '$onChange', off: '$offChange', get: '$get', set: '$set' };
                for (const [name, now] of Object.entries(renamed)) {
                    t.match(thrown(() => model[name](() => {})), new RegExp('\\.' + name + '\\(\\) is now \\.\\' + now + '\\(\\)'), 'model.' + name + '() throws, naming ' + now + '()');
                }
                t.match(thrown(() => model.list.on(() => {})), /\.on\(\) is now \.\$onChange\(\)/, 'an array .on() throws too');
                t.match(thrown(() => model.tags.on(() => {})), /\.on\(\) is now \.\$onChange\(\)/, 'a Set .on() throws too');
                const withField = Stitch.Observable.create({ on: true });
                t.equal(withField.on, true, 'a data field named on reads as data');
                t.match(thrown(() => withField.on(() => {})), /not a function/, 'calling it as a function throws a TypeError');
            });

            // $off(event, cb) removes cb whether it was added with $on or $once; after a $once fired,
            // cb is no longer subscribed and $off throws.
            await StitchTest.test('off-removes-a-once-subscription', async (t) => {
                const model = Stitch.Observable.create({ n: 1 });
                let runs = 0;
                const cb = () => { runs++; };
                model.$once('ping', cb);
                t.equal(thrown(() => model.$off('ping', cb)), '', '$off(event, cb) removes a pending $once subscription of cb');
                model.$emit('ping');
                await new Promise(resolve => setTimeout(resolve, 20));
                t.equal(runs, 0, 'so it never runs');
                model.$once('ping', cb);
                model.$emit('ping');
                await new Promise(resolve => setTimeout(resolve, 20));
                t.equal(runs, 1, 'a $once runs once');
                t.match(thrown(() => model.$off('ping', cb)), /is not subscribed to "ping"/, 'after it ran, $off throws: it is no longer subscribed');
            });

            // R3-1: no overloads. Events and change handlers have their own methods, and every
            // wrong form throws, naming the right one.
            await StitchTest.test('events-and-change-handlers-do-not-overload', async (t) => {
                const model = Stitch.Observable.create({ n: 1 });
                const fn = () => {};
                t.match(thrown(() => model.$on(fn)), /\$on\(fn\): \$on needs an event name; for change handlers use \$onChange\(fn\)/, '$on(fn) (a forgotten event name) throws, naming $onChange');
                t.match(thrown(() => model.$on(fn, 'saved')), /swapped.*\$on\(event, callback\)/, '$on(fn, "saved") (swapped arguments) throws');
                t.match(thrown(() => model.$off(fn)), /\$off\(event, callback\).*\$offChange\(fn\)/, '$off(fn) without an event name throws, naming both correct forms');
                t.match(thrown(() => model.$off()), /\$off\(event, callback\).*\$offChange\(fn\)/, '$off() with no arguments throws');
                t.match(thrown(() => model.$onChange('saved', fn)), /\$onChange\(fn\).*for events use \$on\(event, callback\)/, '$onChange("saved", fn) throws, naming $on');
                t.match(thrown(() => model.$onChange(fn, fn)), /\$onChange\(fn\) takes one argument/, '$onChange with two arguments throws');
                let changes = 0;
                model.$onChange(() => { changes++; });
                let events = 0;
                model.$on('saved', () => { events++; });
                model.n = 2;
                model.$emit('saved');
                await new Promise(resolve => setTimeout(resolve, 20));
                t.equal(changes, 1, 'control: $onChange(fn) fires on a write');
                t.equal(events, 1, 'control: $on(event, cb) fires on its event only');
            });

            await StitchTest.test('old-name-assignment-throws', async (t) => {
                'use strict';
                const model = Stitch.Observable.create({ n: 1 });
                const sloppyAssign = new Function('m', 'm.on = function () {}; return m.on;');
                t.match(thrown(() => sloppyAssign(model)), /\.on\(\) is now \.\$onChange\(\)/, 'assigning model.on (even in sloppy code) throws the migration message');
                t.match(thrown(() => { Stitch.Observable.create({ list: [] }).list.on = 1; }), /\.on\(\) is now \.\$onChange\(\)/, 'assigning .on on an array throws too');
                t.equal(thrown(() => model.$set('on', true)), '', 'control: $set("on", value) adds a data field named on');
                t.equal(model.on, true, 'control: which reads as data');
            });

            // D29: events live on the root model only. Nested objects (and rows, arrays, Maps,
            // Sets) keep change handlers ($onChange / $offChange) but have no event methods.
            await StitchTest.test('events-live-on-the-root-model', async (t) => {
                const model = Stitch.Observable.create({ user: { name: 'a' }, rows: [{ id: 1 }], tags: new Set(['x']), prices: new Map([['a', 1]]) });
                const row = model.rows[0];
                const nested = [
                    ['row.$emit', () => row.$emit('saved')],
                    ['model.user.$emit', () => model.user.$emit('saved')],
                    ['model.user.$on', () => model.user.$on('saved', () => {})],
                    ['model.rows.$on', () => model.rows.$on('saved', () => {})],
                    ['model.tags.$once', () => model.tags.$once('saved', () => {})],
                    ['model.prices.$off', () => model.prices.$off('saved', () => {})]
                ];
                for (const [what, fn] of nested) {
                    t.match(thrown(fn), /events live on the root model: use model\.\$emit\('saved'\)/, what + ' throws: events live on the root model');
                }
                let received = 0;
                model.$on('saved', () => { received++; });
                model.$emit('saved');
                await new Promise(resolve => setTimeout(resolve, 20));
                t.equal(received, 1, 'model.$emit still reaches model.$on');
                const changes = [];
                const watcher = change => changes.push(change.field);
                model.user.$onChange(watcher);
                model.user.name = 'b';
                t.deepEqual(changes, ['name'], 'a nested object keeps $onChange (decision: change handlers stay on nested objects)');
                model.user.$offChange(watcher);
                model.user.name = 'c';
                t.deepEqual(changes, ['name'], 'and $offChange removes it');
            });

            // D30: one model = one root. A model, or an object of another model, cannot be put
            // into a model by any write path; the error names the target path.
            await StitchTest.test('a-model-cannot-be-nested', async (t) => {
                const NESTED = /A model cannot be nested in another model: assign plain data, or Observable\.toRaw\(/;
                const app = Stitch.Observable.create({ cart: null, rows: [{ id: 1 }], tags: new Set(), prices: new Map(), info: {} });
                const cart = () => Stitch.Observable.create({ total: 1 });
                const cases = [
                    ['app.cart = model', () => { app.cart = cart(); }, /"cart"/],
                    ['an isolated model', () => { app.cart = Stitch.Observable.create({ total: 1 }, { isolated: true }); }, /"cart"/],
                    ['rows.push(model)', () => app.rows.push(cart()), /"rows\[1\]"/],
                    ['rows.unshift(model)', () => app.rows.unshift(cart()), /"rows\[0\]"/],
                    ['rows.splice(0, 0, model)', () => app.rows.splice(0, 0, cart()), /"rows\[0\]"/],
                    ['rows[0] = model', () => { app.rows[0] = cart(); }, /"rows\[0\]"/],
                    ['Map.set', () => app.prices.set('a', cart()), /"prices/],
                    ['Set.add', () => app.tags.add(cart()), /"tags/],
                    ['$set', () => app.$set('cart', cart()), /"cart"/],
                    ['a model inside plain data', () => { app.info = { inner: cart() }; }, /"info\.inner"/],
                    ['at create', () => Stitch.Observable.create({ cart: cart() }), /"cart"/],
                    ['createArray', () => Stitch.Observable.createArray([cart()]), /"\[0\]"/]
                ];
                for (const [what, fn, where] of cases) {
                    const message = thrown(fn);
                    t.ok(NESTED.test(message) && where.test(message), `${what} throws, naming the target path (got: ${message.slice(0, 120)})`);
                }
                t.equal(app.cart, null, 'the failed assignment left the model unchanged');
                t.equal(app.rows.length, 1, 'the failed push left the list unchanged');

                const other = Stitch.Observable.create({ rows: [{ id: 7, name: 'x' }], user: { name: 'u' } });
                const b = Stitch.Observable.create({ current: null, list: [] });
                t.match(thrown(() => { b.current = other.rows[0]; }), /belongs to a different model/, 'an object of another model cannot be assigned');
                t.match(thrown(() => b.list.push(other.user)), /belongs to a different model/, 'or pushed');
                t.equal(thrown(() => { b.current = Stitch.Observable.toRaw(other.rows[0]); }), '', 'control: its plain copy can');
            });

            await StitchTest.test('moving-within-a-model-re-points-the-parent', async (t) => {
                const m = Stitch.Observable.create({ listA: [{ id: 1, name: 'x' }], listB: [], a: { inner: { v: 1 } }, b: null });
                const fields = [];
                m.$onChange(change => fields.push(change.field));
                const row = m.listA[0];
                m.listA.splice(0, 1);
                t.equal(thrown(() => m.listB.push(row)), '', 'a row moves from list A to list B of the same model');
                await tick();
                fields.length = 0;
                row.name = 'y';
                await tick();
                t.deepEqual(fields, ['listB.0.name'], 'a write to the moved row bubbles from its new place');
                t.match(thrown(() => m.listB[0].$set('meta', { toJSON: 1 })), /"listB\[0\]\.meta\.toJSON" is reserved/,
                    'and a toJSON error names the new path');
                const inner = m.a.inner;
                t.equal(thrown(() => { m.b = inner; m.a.inner = null; }), '', 'a nested object moved elsewhere in the same model (old slot cleared) works');
                await tick();
                fields.length = 0;
                inner.v = 2;
                await tick();
                t.deepEqual(fields, ['b.v'], 'and its writes bubble from the new place');
                m.listB.unshift({ id: 2, name: 'first' });
                await tick();
                fields.length = 0;
                row.name = 'z';
                await tick();
                t.deepEqual(fields, ['listB.1.name'], 'an unshift re-points the indexes of the rows after it');
            });

            await StitchTest.test('to-raw-returns-plain-data', async (t) => {
                const m = Stitch.Observable.create({ n: 1, user: { name: 'a' }, rows: [{ id: 1 }], tags: new Set(['x']), total: Stitch.computed(function () { return this.n * 2; }) });
                const raw = Stitch.Observable.toRaw(m);
                t.deepEqual(JSON.parse(JSON.stringify(raw)), { n: 1, user: { name: 'a' }, rows: [{ id: 1 }], tags: {}, total: 2 }, 'toRaw copies the values (computeds included)');
                t.equal(Stitch.Observable.isReactive(raw) || Stitch.Observable.isReactive(raw.user) || Stitch.Observable.isReactive(raw.rows), false, 'nothing in it is reactive');
                t.ok(Array.isArray(raw.rows) && raw.tags instanceof Set && raw.tags.has('x'), 'arrays stay arrays, Sets stay Sets');
                t.equal(Stitch.Observable.isReactive(Stitch.Observable.toRaw(m.rows)), false, 'toRaw of a list gives a plain array');
            });

            await StitchTest.test('reactive-on-a-nested-object-throws', async (t) => {
                const m = Stitch.Observable.create({ user: { name: 'a' } });
                t.match(thrown(() => Stitch.Observable.reactive(m.user)), /"user" already belongs to a model; use the root model/, 'Observable.reactive(model.user) throws');
                t.match(thrown(() => Stitch.Observable.create(m.user)), /"user" already belongs to a model; use the root model/, 'Observable.create(model.user) throws');
                t.ok(Stitch.Observable.reactive(m) === m, 'control: reactive(root) returns the root');
            });

            // B7: a raw array / Map / Set that already belongs to one model cannot be reused by
            // another (the proxy cache used to hand the first model's proxy to the second).
            await StitchTest.test('shared-raw-collections-throw', async (t) => {
                const COUNTRIES = [{ id: 1, name: 'US' }];
                const RATES = new Map([['usd', 1]]);
                const CODES = new Set(['US']);
                Stitch.Observable.create({ countries: COUNTRIES, rates: RATES, codes: CODES });
                const SHARED = /"(countries|rates|codes)" already belongs to a model; give each model its own copy \((\[\.\.\.countries\]|new Map\(rates\)|new Set\(codes\))\)/;
                t.match(thrown(() => Stitch.Observable.create({ countries: COUNTRIES })), SHARED, 'a shared array throws, telling the fix ([...countries])');
                t.match(thrown(() => Stitch.Observable.create({ rates: RATES })), SHARED, 'a shared Map throws (new Map(rates))');
                t.match(thrown(() => Stitch.Observable.create({ codes: CODES })), SHARED, 'a shared Set throws (new Set(codes))');
                t.match(thrown(() => Stitch.Observable.create({ countries: COUNTRIES }, { isolated: true })), SHARED, 'also into an isolated model');
                const later = Stitch.Observable.create({ countries: [] });
                t.match(thrown(() => { later.countries = COUNTRIES; }), SHARED, 'also by a later assignment');
                t.equal(thrown(() => Stitch.Observable.create({ countries: [...COUNTRIES] })), '', 'control: a copy is accepted');
            });

            await StitchTest.test('set-members-and-map-values-cannot-move-across-models', async (t) => {
                const a = Stitch.Observable.create({ tags: new Set(), prices: new Map() });
                const member = { name: 'x' };
                a.tags.add(member);
                const value = { price: 1 };
                a.prices.set('p', value);
                const b = Stitch.Observable.create({ current: null });
                t.match(thrown(() => { b.current = member; }), /belongs to a different model/, 'a Set member of model a cannot be assigned into model b');
                t.match(thrown(() => { b.current = a.prices.get('p'); }), /belongs to a different model/, 'nor a Map value');
                t.match(thrown(() => a.tags.add({ inner: Stitch.Observable.create({ x: 1 }) })), /"tags\.value\.inner"/, 'the Set.add error path names the collection');
            });

            await StitchTest.test('map-and-set-initial-content-is-reactive', async (t) => {
                const m = Stitch.Observable.create({
                    prices: new Map([['a', { price: 1 }]]),
                    shown: Stitch.computed(function () { return this.prices.get('a').price; })
                });
                const host = document.createElement('div');
                host.innerHTML = '<span data-text="shown"></span>';
                document.body.appendChild(host);
                new Stitch.DataBinder().bind(host, m);
                t.equal(host.textContent, '1', 'precondition: the initial Map value renders');
                m.prices.get('a').price = 5;
                await tick();
                t.equal(host.textContent, '5', 'a write to an initial Map value updates the binding');
                t.equal(Stitch.Observable.isReactive(m.prices.get('a')), true, 'the initial Map value is reactive, like one added later');
                host.remove();
                t.match(thrown(() => Stitch.Observable.create({ prices: new Map([['a', { inner: Stitch.Observable.create({ x: 1 }) }]]) })),
                    /"prices\.a\.inner"/, 'a model inside an initial Map value throws at create');
            });

            // B8: within one model an object may be held in two places (the "selected row"); the
            // FIRST place that still holds it is its parent. Writes report that place.
            await StitchTest.test('aliases-keep-the-first-parent', async (t) => {
                const m = Stitch.Observable.create({ rows: [{ id: 1, name: 'a' }, { id: 2, name: 'b' }], selected: null });
                const fields = [];
                m.$onChange(change => fields.push(change.field));
                const write = async (obj, value) => { await tick(); fields.length = 0; obj.name = value; await tick(); return fields.slice(); };
                const first = m.rows[0];
                m.selected = first;
                t.deepEqual(await write(first, 'a2'), ['rows.0.name'], 'selected = rows[0]: a write reports rows.0.name');
                m.selected = null;
                t.deepEqual(await write(first, 'a3'), ['rows.0.name'], 'after selected = null it is still rows.0.name');
                m.selected = first;
                m.rows.unshift({ id: 0, name: 'z' });
                t.deepEqual(await write(first, 'a4'), ['rows.1.name'], 'unshift re-indexes the aliased row too');
                m.selected = m.rows[2];
                t.match(thrown(() => m.rows[2].$set('meta', { toJSON: 1 })), /"rows\[2\]\.meta\.toJSON" is reserved/, 'a toJSON error names the first place (rows[2])');
                m.selected = first;
                m.rows.splice(1, 1);
                t.deepEqual(await write(first, 'a5'), ['selected.name'], 'removed from rows while held by selected: its parent moves to selected');
                const ARR = [{ id: 1 }];
                const both = Stitch.Observable.create({ a: ARR, b: ARR });
                const bothFields = [];
                both.$onChange(change => bothFields.push(change.field));
                both.b.push({ id: 2 });
                await tick();
                t.deepEqual(bothFields, ['a.items'], 'create({ a: ARR, b: ARR }): the first place (a) is reported');
            });

            await StitchTest.test('message-bus-arguments', async (t) => {
                const bus = new Stitch.MessageBus();
                t.match(thrown(() => bus.subscribe('', () => {})), /event name must be a non-empty string/, 'subscribe with an empty event throws');
                t.match(thrown(() => bus.subscribe('x', null)), /callback must be a function/, 'subscribe with a non-function throws');
                t.match(thrown(() => bus.unsubscribe('x', () => {})), /is not subscribed to "x"/, 'unsubscribe of an unknown callback throws');
                t.match(thrown(() => bus.publish(undefined)), /event name must be a non-empty string/, 'publish without an event name throws');
                t.match(thrown(() => bus.publishSync(7)), /event name must be a non-empty string/, 'publishSync with a non-string event throws');
                t.match(thrown(() => bus.use({})), /middleware must be a function/, 'use with a non-function throws');
                const off = bus.subscribe('x', () => {});
                t.equal(thrown(() => off()), '', 'control: the returned unsubscribe works');
                t.equal(thrown(() => off()), '', 'control: and calling it again is harmless (it is the handle, not a lookup)');
            });
        })();
    </script>
</body>
</html>
