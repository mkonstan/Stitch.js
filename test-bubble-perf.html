<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Stitch.js Bubble Up Performance Test</title>
    <script src="stitch.js"></script>
    <script src="tests/harness.js"></script>
</head>
<body>
    <h1>Bubble Up Performance</h1>
    <div id="output"></div>
    <script>
        StitchTest.plan(['deep-leaf-updates-correct', 'deep-leaf-updates-bounded']);

        // 100 levels deep, 1000 writes at the leaf.
        const DEPTH = 100;
        const ITERATIONS = 1000;
        // Generous bound: catches a pathological (e.g. quadratic) bubbling
        // regression, not normal machine-to-machine noise. Typical: well under 100 ms.
        const MAX_MS = 2000;

        function createDeepObject(depth) {
            const root = { value: 0 };
            let current = root;
            for (let i = 0; i < depth; i++) {
                current.next = { value: i + 1 };
                current = current.next;
            }
            return root;
        }

        const app = Stitch.Observable.create(createDeepObject(DEPTH));
        let leaf = app;
        let levels = 0;
        while (leaf.next) { leaf = leaf.next; levels++; }

        const start = performance.now();
        for (let i = 0; i < ITERATIONS; i++) {
            leaf.value = i;
        }
        const duration = performance.now() - start;
        document.getElementById('output').textContent =
            `Depth: ${DEPTH}, Iterations: ${ITERATIONS}, Time: ${duration.toFixed(2)}ms`;

        StitchTest.test('deep-leaf-updates-correct', (t) => {
            t.equal(levels, DEPTH, 'walked down every level');
            t.equal(leaf.value, ITERATIONS - 1, 'leaf holds the last written value');
        });
        StitchTest.test('deep-leaf-updates-bounded', (t) => {
            t.ok(duration < MAX_MS, `${ITERATIONS} leaf writes at depth ${DEPTH} took ${duration.toFixed(1)} ms (limit ${MAX_MS} ms)`);
        });
    </script>
</body>
</html>
