<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Stitch.js Map/Set Reactivity Test</title>
</head>
<body>
    <h1>Map/Set Reactivity Test</h1>
    <!--
        Map and Set changes must reach bindings through computed properties:
        size, get/has, and iteration each create a dependency.
    -->
    <div id="app">
        <section>
            <h2>Map</h2>
            <div id="map-size" data-text="mapSize"></div>
            <div id="map-value" data-text="mapValue"></div>
            <div id="map-iter" data-text="mapEntries"></div>
        </section>
        <section>
            <h2>Set</h2>
            <div id="set-size" data-text="setSize"></div>
            <div id="set-has" data-text="setHas"></div>
            <div id="set-iter" data-text="setValues"></div>
        </section>
    </div>

    <script src="stitch.js"></script>
    <script src="tests/harness.js"></script>
    <script>
        StitchTest.plan(['map-initial', 'map-set-new-key', 'map-set-existing-key', 'map-delete',
            'set-initial', 'set-add', 'set-delete']);

        const model = Stitch.Observable.create({
            myMap: new Map([['key1', 'initial']]),
            mySet: new Set(['item1']),
            mapSize: Stitch.computed(function () { return this.myMap.size; }),
            mapValue: Stitch.computed(function () {
                const value = this.myMap.get('key1');
                return value === undefined ? '' : value;
            }),
            mapEntries: Stitch.computed(function () {
                return Array.from(this.myMap.entries()).map(e => e[0] + ':' + e[1]).join(', ');
            }),
            setSize: Stitch.computed(function () { return this.mySet.size; }),
            setHas: Stitch.computed(function () { return this.mySet.has('item1') ? 'true' : 'false'; }),
            setValues: Stitch.computed(function () { return Array.from(this.mySet.values()).join(', '); })
        });
        new Stitch.DataBinder().bind('#app', model);

        const text = (id) => document.getElementById(id).textContent;
        const tick = () => new Promise(resolve => setTimeout(resolve, 50));

        (async () => {
            await tick();
            await StitchTest.test('map-initial', (t) => {
                t.equal(text('map-size'), '1', 'Map initial size');
                t.equal(text('map-value'), 'initial', 'Map initial value');
                t.equal(text('map-iter'), 'key1:initial', 'Map initial entries');
            });
            await StitchTest.test('map-set-new-key', async (t) => {
                model.myMap.set('key2', 'new');
                await tick();
                t.equal(text('map-size'), '2', 'size after adding a key');
                t.equal(text('map-iter'), 'key1:initial, key2:new', 'entries after adding a key');
            });
            await StitchTest.test('map-set-existing-key', async (t) => {
                model.myMap.set('key1', 'updated');
                await tick();
                t.equal(text('map-value'), 'updated', 'get() after updating a key');
                t.equal(text('map-iter'), 'key1:updated, key2:new', 'entries after updating a key');
            });
            await StitchTest.test('map-delete', async (t) => {
                model.myMap.delete('key1');
                await tick();
                t.equal(text('map-size'), '1', 'size after delete');
                t.equal(text('map-value'), '', 'get() of the deleted key');
                t.equal(text('map-iter'), 'key2:new', 'entries after delete');
            });
            await StitchTest.test('set-initial', (t) => {
                t.equal(text('set-size'), '1', 'Set initial size');
                t.equal(text('set-has'), 'true', 'Set initial has()');
                t.equal(text('set-iter'), 'item1', 'Set initial values');
            });
            await StitchTest.test('set-add', async (t) => {
                model.mySet.add('item2');
                await tick();
                t.equal(text('set-size'), '2', 'size after add');
                t.equal(text('set-iter'), 'item1, item2', 'values after add');
            });
            await StitchTest.test('set-delete', async (t) => {
                model.mySet.delete('item1');
                await tick();
                t.equal(text('set-size'), '1', 'size after delete');
                t.equal(text('set-has'), 'false', 'has() after delete');
                t.equal(text('set-iter'), 'item2', 'values after delete');
            });
        })();
    </script>
</body>
</html>
