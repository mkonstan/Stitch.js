<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Unbind Memory Leak</title>
    <script src="stitch.js"></script>
    <script src="tests/harness.js"></script>
    <style>
        .fail { color: red; font-weight: bold; }
        .pass { color: green; font-weight: bold; }
    </style>
</head>
<body>
    <h1>Test: Unbind Memory Leak (Zombie Effects)</h1>
    <div id="results"></div>

    <div id="app">
        <div id="target" data-text="count"></div>
    </div>

    <script>
        StitchTest.plan(['bound-element-updates', 'unbound-element-stops-updating']);

        const tick = () => new Promise(resolve => setTimeout(resolve, 50));
        const model = Stitch.Observable.create({ count: 0 });
        const binder = new Stitch.DataBinder();
        const target = document.getElementById('target');
        binder.bind('#app', model);

        (async () => {
            await StitchTest.test('bound-element-updates', async (t) => {
                model.count = 1;
                await tick();
                t.equal(target.textContent, '1', 'bound element shows the new value');
            });

            await StitchTest.test('unbound-element-stops-updating', async (t) => {
                t.equal(target.textContent, '1', 'precondition: element shows 1 before unbind');
                binder.unbind(target);
                model.count = 999;
                await tick();
                t.equal(target.textContent, '1', 'after unbind the element keeps its old text (no zombie effect)');
            });
        })();
    </script>
</body>
</html>
