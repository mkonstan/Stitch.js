<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Foreach Context Pollution</title>
    <script src="stitch.js"></script>
    <script src="tests/harness.js"></script>
</head>
<body>
    <h1>Test: Foreach Context Pollution</h1>

    <!--
        SCENARIO: two lists render the SAME objects.
        List 1: all items (A at index 0). List 2: a subset (A at index 1).
        BUG this guards against: if row context ($index) were written onto the
        shared object, list 2 would overwrite list 1's index.
    -->
    <div id="app">
        <div id="list1" data-foreach="allItems">
            <div class="item-row">
                <span data-text="name"></span>
                <span data-text="$index"></span>
            </div>
        </div>

        <div id="list2" data-foreach="selectedItems">
            <div class="item-row">
                <span data-text="name"></span>
                <span data-text="$index"></span>
                <button data-click="$parent.selectItem">Select</button>
            </div>
        </div>
    </div>

    <script>
        StitchTest.plan(['list1-index-correct', 'raw-item-not-polluted', 'list2-index-correct', 'parent-handler-receives-item']);

        const tick = () => new Promise(resolve => setTimeout(resolve, 100));
        const itemA = { id: 1, name: 'Item A' };
        const itemB = { id: 2, name: 'Item B' };
        const itemC = { id: 3, name: 'Item C' };
        const clicked = [];

        const model = Stitch.Observable.create({
            allItems: [itemA, itemB, itemC],
            selectedItems: [itemC, itemA],
            selectItem(item) { clicked.push(item); }
        });
        new Stitch.DataBinder().bind('#app', model);

        function indexText(listId, row) {
            return document.querySelectorAll(`#${listId} .item-row`)[row].querySelectorAll('span')[1].textContent;
        }

        (async () => {
            await tick();

            await StitchTest.test('list1-index-correct', (t) => {
                t.equal(indexText('list1', 0), '0', 'list 1 shows index 0 for Item A');
            });

            await StitchTest.test('raw-item-not-polluted', (t) => {
                t.equal(itemA.$index, undefined, 'no $index written onto the shared item');
            });

            await StitchTest.test('list2-index-correct', (t) => {
                t.equal(indexText('list2', 1), '1', 'list 2 shows index 1 for Item A');
            });

            await StitchTest.test('parent-handler-receives-item', (t) => {
                document.querySelectorAll('#list2 .item-row button')[1].click();
                t.equal(clicked.length, 1, '$parent.selectItem ran once');
                const got = clicked[0] && (clicked[0].$data || clicked[0]);
                t.equal(got && got.id, 1, 'the handler received Item A (raw item or its $data)');
            });
        })();
    </script>
</body>
</html>
