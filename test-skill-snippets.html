<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test: the Claude skill's code blocks</title>
    <script src="stitch.js"></script>
    <script src="tests/harness.js"></script>
    <script src="tests/doc-snippets.js"></script>
</head>
<body>
    <h1>The Claude skill, executed</h1>
    <p>Every <code>html</code> / <code>js</code> code block of the skill in <code>skills/stitch/</code>
    (SKILL_SET in <code>tests/doc-snippets.js</code>) runs here, each in its own frame, against the build
    under test. A <code>run</code> block must not throw; hidden <code>check</code> comments must hold.</p>
    <p id="snippet-summary"></p>
    <div id="frames"></div>
    <script>
        StitchDocSnippets.run(StitchDocSnippets.SKILL_SET, { host: document.getElementById('frames'), concurrency: 12 }).catch(function (error) {
            // A document that cannot be fetched or parsed fails the page loudly.
            setTimeout(function () { throw error; }, 0);
        });
    </script>
</body>
</html>
